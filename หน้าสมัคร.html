<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>สมัครสมาชิก - ระบบจองอาหารออนไลน์</title>
        <style>
           body{
            
            font-family: segoe ui, tahoma, geneva, verdana, arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
           }
           .register-card{
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
           }
           h2{
            text-align: center;
            margin-bottom: 20px;
            color: #ff6b6b;
           }

           .form-group{
            margin-bottom: 15px;
           }
              .label{
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
              }
              input{
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
              }
              button{
                background-color: #2ed573;
                color: #fff;
                border: none;
                padding: 12px;
                font-size: 16px;
                border-radius: 6px;
                cursor: pointer;
                width: 100%;
                font-weight: bold;
                margin-top: 10px;   
              }
              .button:hover{
                background-color: #26af5f;

              }
              .back-link a {
                color: #ff6b6b;
                text-decoration: none;
                font-size: 14px;
              }
              .back-link a:hover {
                text-decoration: underline;
              }
          </style>     
    </head>
    <body>

        <div class="register-card">
                <h2>สมัครสมาชิก</h2>
               <div class="form-group">
                <label for="username" class="label">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="reguser" placeholder="ตั้งชื่อผู้ใช้งานของคุณ" required>
               </div>
             <div class="form-group">
                <label for="password" class="label">รหัสผ่าน (Password)</label>
                <input type="password" id="regpass" placeholder="ตั้งรหัสผ่านของคุณ" required>
               </div>
               <button type="submit">สมัครสมาชิก</button>

               </form>

               <div class="back-link">
               <a href="index.html">กลับไปยังหน้าเข้าสู่ระบบ</a>
               </div>
        </div>  
        <script>
            const registerForm = document.getElementById('registerForm');

            registerForm.addEventListener('submit', function(event) {
                event.preventDefault(); // ป้องกันหน้าเว็ปจากการรีเฟรช

                const username = document.getElementById('reguser').value;
                const password = document.getElementById('regpass').value;

                // บันทึกข้อมูลผู้ใช้ใหม่ลหรือ 
                localStorage.setItem('savedUsername', username);
                localStorage.setItem('savedPassword', password); // คุณสามารถเพิ่มรหัสผ่านได้ตามต้องการ

                // แสดงข้อความยืนยันการสมัครสมาชิก
                alert('สมัครสมาชิกสำเร็จ! คุณสามารถเข้าสู่ระบบได้แล้ว.');
                //เด้งไปยังหน้าเข้าสู่ระบบ
                window.location.href = 'index.html';
            });
            </script>
    </body>
</html>
