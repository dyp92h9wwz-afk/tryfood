<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจองอาหารออนไลน์</title>
    <style>
    body{
        font-family: segoe ui, tahoma, geneva, verdana, arial, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;

    }
    .login-card{
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 380px;
    }
    h2{
        text-align: center;
        margin-bottom: 20px;
        color: #ff6b6b;
    }
    .form-group{
        margin-bottom: 15px;
    }
    .label{
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        
    }
    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }
    button{
        width: 100%;
        padding: 10px;
        background-color: #ff6b6b;
        color: #fff;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        

    }
    button:hover{
        background-color: #ee5253;
    }
    .register-link{
        text-align: center;
        margin-top: 15px;
    }
    .register-link a{
        color: #ff6b6b;
        text-decoration: none;
        font-size: 14px;
    
    }
    .register-link a:hover{
        text-decoration: underline;
    }
    .hint{
        font-size: 12px;
        color: #666;
        margin-top: 15px;
        text-align: center;
        background-color: #f1f2f6;
        padding: 10px;
        border-radius: 6px;
    }
    
    
</style>
</head>
<body>
<div class="login-card">
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username" class="label">ชื่อผู้ใช้งาน</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password" class="label">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="hint">
        <p>สำหรับผู้ดูแลระบบ: ชื่อผู้ใช้งาน: admin, รหัสผ่าน: admin123</p>
        <p>สำหรับผู้ใช้งานทั่วไป: ชื่อผู้ใช้งาน: user, รหัสผ่าน: user123</p>  
    </div>
    <div class="register-link">
        <p>ยังไม่มีบัญชีผู้ใช้งาน? <a href="หน้าสมัคร.html">สมัครสมาชิก</a></p>
    </div>
    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();//ป้องกันไม่ให้หน้าเว็ปรีเฟรช
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            //ดึงข้อมูลจาก localStorage มาเช็ค
            const storedUsername = localStorage.getItem('username');
            const storedPassword = localStorage.getItem('password');
            //ตรวจสอบว่าเป็นแอดมินหรือลูกค้าทั่วไป
            if (username === 'admin' && password === 'admin123') {
                alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับผู้ดูแลระบบ');
                window.location.href = 'admin.html'; //เปลี่ยนเส้นทางไปยัง
            } else if (username === 'user' && password === 'user123') {
                alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับผู้ใช้งานทั่วไป');
                window.location.href = 'user.html'; //เปลี่ยนเส้นทางไปยัง
            } else {
                alert('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
            }
        });
    </script>
</body>

</html>
