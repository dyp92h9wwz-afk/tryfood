<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหารและการจอง - ระบบจองอาหารออนไลน์</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background-color: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        header button {
            background-color: white;
            color: #ff6b6b;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        header button:hover {
            background-color: #f1f2f6;
        }
        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        h2 {
            border-bottom: 2px solid #ff6b6b;
            padding-bottom: 8px;
            color: #ff6b6b;
            margin-top: 0;
        }
        /* เมนูอาหาร Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .menu-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: #fff;
        }
        .menu-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
        }
        .price {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.1em;
            margin: 10px 0;
        }
        .add-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .add-btn:hover {
            background-color: #26af5f;
        }
        /* ตะกร้าสินค้า */
        #cartList {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }
        #cartList li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .total-price {
            font-size: 1.2em;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }
        /* ฟอร์มจองโต๊ะ */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #ee5253;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>🍽️ ร้านอาหารกูร์เมต์</h1>
                <p style="margin: 5px 0 0 0;">ยินดีต้อนรับสู่ระบบสั่งอาหารและจองโต๊ะ</p>
            </div>
            <button onclick="logout()">ออกจากระบบ</button>
        </header>

        <!-- ส่วนที่ 1: รายการอาหาร -->
        <div class="section">
            <h2>รายการอาหารแนะนำ</h2>
            <div class="menu-grid">
                
                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400" alt="สลัดผัก">
                    <h3>สลัดผักเพื่อสุขภาพ</h3>
                    <p class="price">120 บาท</p>
                    <button class="add-btn" onclick="addToCart('สลัดผักเพื่อสุขภาพ', 120)">เพิ่มลงตะกร้า</button>
                </div>

                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400" alt="พิซซ่า">
                    <h3>พิซซ่าเตาถ่าน</h3>
                    <p class="price">290 บาท</p>
                    <button class="add-btn" onclick="addToCart('พิซซ่าเตาถ่าน', 290)">เพิ่มลงตะกร้า</button>
                </div>

                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400" alt="สเต็ก">
                    <h3>สเต็กเนื้อพรีเมียม</h3>
                    <p class="price">350 บาท</p>
                    <button class="add-btn" onclick="addToCart('สเต็กเนื้อพรีเมียม', 350)">เพิ่มลงตะกร้า</button>
                </div>

            </div>
        </div>

        <!-- ส่วนที่ 2: ตะกร้าสินค้า -->
        <div class="section">
            <h2>🛒 ตะกร้าอาหารของคุณ</h2>
            <ul id="cartList">
                <li style="color: #888;">ยังไม่มีสินค้าในตะกร้า</li>
            </ul>
            <div class="total-price">ราคารวม: <span id="totalPrice">0</span> บาท</div>
        </div>

        <!-- ส่วนที่ 3: ฟอร์มยืนยันการจองและสั่งซื้อ -->
        <div class="section">
            <h2>📅 สำรองที่นั่งและยืนยันออเดอร์</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="name">ชื่อผู้จอง:</label>
                    <input type="text" id="name" placeholder="กรอกชื่อของคุณ" required>
                </div>
                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์:</label>
                    <input type="tel" id="phone" placeholder="08X-XXX-XXXX" required>
                </div>
                <div class="form-group">
                    <label for="guests">จำนวนโต๊ะ / จำนวนคน:</label>
                    <select id="guests">
                        <option value="1-2 ท่าน">1-2 ท่าน</option>
                        <option value="3-4 ท่าน">3-4 ท่าน</option>
                        <option value="5+ ท่าน">5 ท่านขึ้นไป</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="datetime">วันที่และเวลา:</label>
                    <input type="datetime-local" id="datetime" required>
                </div>
                <button type="submit" class="submit-btn">ยืนยันการจองและสั่งอาหาร</button>
            </form>
        </div>
    </div>

    <script>
        // ตัวแปรเก็บรายการในตะกร้าและราคารวม
        let cart = [];
        let total = 0;

        // ฟังก์ชันเพิ่มอาหารลงตะกร้า
        function addToCart(itemName, itemPrice) {
            cart.push({ name: itemName, price: itemPrice });
            total += itemPrice;
            updateCartUI();
        }

        // ฟังก์ชันอัปเดตหน้าตาตะกร้าสินค้า
        function updateCartUI() {
            const cartList = document.getElementById('cartList');
            const totalPriceElem = document.getElementById('totalPrice');

            cartList.innerHTML = ''; //เคลียร์ของเก่า

            if (cart.length === 0) {
                cartList.innerHTML = '<li style="color: #888;">ยังไม่มีสินค้าในตะกร้า</li>';
            } else {
                cart.forEach((item, index) => {
                    cartList.innerHTML += `<li>${index + 1}. ${item.name} <span>${item.price} บาท</span></li>`;
                });
            }
            totalPriceElem.innerText = total;
        }

        // ฟังก์ชันส่งออเดอร์
        const orderForm = document.getElementById('orderForm');
        orderForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert('กรุณาเลือกเมนูอาหารอย่างน้อย 1 อย่างก่อนยืนยันการจอง!');
                return;
            }

            const customerName = document.getElementById('name').value;
            const customerPhone = document.getElementById('phone').value;
            const guests = document.getElementById('guests').value;
            const datetime = document.getElementById('datetime').value;

            // สร้างข้อมูลออเดอร์
            const orderData = {
                name: customerName,
                phone: customerPhone,
                guests: guests,
                datetime: datetime,
                items: cart,
                total: total
            };

            // บันทึกออเดอร์ลง localStorage เพื่อให้หน้า Admin ดึงไปแสดงผลต่อได้ในอนาคต
            let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];
            allOrders.push(orderData);
            localStorage.setItem('allOrders', JSON.stringify(allOrders));

            alert('จองโต๊ะและสั่งอาหารสำเร็จเรียบร้อยแล้ว! ขอบคุณครับ');
            
            // รีเซ็ตฟอร์มและตะกร้า
            cart = [];
            total = 0;
            updateCartUI();
            orderForm.reset();
        });

        // ฟังก์ชันออกจากระบบ
        function logout() {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
